[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-event-vo"
version = "0.1.0"
description = "Reproducible event-stream ingestion and visualization for adaptive visual odometry research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.scripts]
adaptive-event-vo = "adaptive_event_vo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
