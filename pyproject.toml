[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-event-vo"
version = "0.2.0"
description = "Reproducible event-stream processing and fixed-window motion baselines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "opencv-python-headless>=4.8,<5"]

[project.scripts]
adaptive-event-vo = "adaptive_event_vo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
